<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranfy</title>
<meta name="description" content="Press the button, get one random song from Spotify. Nothing else." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>



  <main class="page">
    <header class="brand">
      <span class="brand__mark">●</span>
      <h1 class="brand__title">Click</h1>
      <p class="brand__subtitle">One random song. That's it.</p>
    </header>

    <section class="card" aria-live="polite">
      <div class="cover-frame">
        <img id="albumCover" class="cover-frame__img" src="" alt="" hidden />
        <div id="coverPlaceholder" class="cover-frame__placeholder">
          <span>♪</span>
        </div>
      </div>

      <div class="track-info">
        <h2 id="songTitle" class="track-info__title">Press play to begin</h2>
        <p id="artistName" class="track-info__artist">&nbsp;</p>
      </div>

      <a id="spotifyLink" class="btn btn--spotify" href="#" target="_blank" rel="noopener noreferrer" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.41c-.19.31-.59.41-.9.22-2.47-1.51-5.58-1.85-9.25-1.01-.35.08-.7-.14-.78-.49-.08-.35.14-.7.49-.78 4.01-.92 7.45-.52 10.22 1.16.31.19.41.59.22.9zm1.22-2.72c-.24.39-.75.51-1.14.27-2.83-1.74-7.14-2.24-10.49-1.23-.44.13-.9-.12-1.03-.55-.13-.44.12-.9.55-1.03 3.82-1.16 8.57-.6 11.84 1.4.39.24.51.75.27 1.14zm.11-2.83C14.34 8.85 8.98 8.67 5.9 9.62c-.52.16-1.08-.14-1.24-.66-.16-.52.14-1.08.66-1.24 3.53-1.08 9.42-.87 13.14 1.34.47.28.62.89.34 1.36-.28.47-.89.62-1.36.34z"/>
        </svg>
        Listen on Spotify
      </a>

      <button id="randomBtn" class="btn btn--primary">
        Random Song
      </button>

      <p class="attribution">Song data and artwork provided by Spotify.</p>
    </section>

    
  </main>

  <footer class="site-footer">
    <p>Not affiliated with Spotify AB. All track metadata and cover art belong to their respective owners and are provided via the Spotify platform.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
